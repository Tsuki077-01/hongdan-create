<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>跟红蛋说话</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
    .card {
      position: absolute; inset: 6px;
      display: flex; flex-direction: column;
      background: #FFFBF7; border: 2.5px solid #8B3A1E; border-radius: 18px;
      overflow: hidden; color: #5A2412;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 8px; border-bottom: 1.5px dashed rgba(139,58,30,.35);
      -webkit-app-region: drag; user-select: none;
    }
    .dot { width: 14px; height: 17px; border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%; background: #F09A7A; border: 1.8px solid #8B3A1E; }
    header .t { font-size: 14px; font-weight: 600; flex: 1; }
    header button {
      -webkit-app-region: no-drag; border: none; background: none; cursor: pointer;
      color: #8B3A1E; font-size: 16px; width: 26px; height: 26px; border-radius: 8px;
    }
    header button:hover { background: rgba(240,154,122,.2); }

    #log { flex: 1; overflow-y: auto; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 82%; padding: 7px 11px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #F09A7A; color: #fff; border-bottom-right-radius: 4px; }
    .egg { align-self: flex-start; background: #fff; border: 1.8px solid #8B3A1E; border-bottom-left-radius: 4px; }
    .sys { align-self: center; font-size: 12px; color: #9E5A40; text-align: center; max-width: 92%; line-height: 1.6; }
    .typing { align-self: flex-start; font-size: 12px; color: #9E5A40; padding: 2px 4px; }

    form { display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1.5px dashed rgba(139,58,30,.35); }
    #input {
      flex: 1; resize: none; height: 36px; max-height: 90px;
      border: 1.8px solid #8B3A1E; border-radius: 12px; padding: 7px 10px;
      font: inherit; font-size: 13.5px; color: #5A2412; background: #fff; outline: none;
    }
    #send {
      border: none; border-radius: 12px; padding: 0 14px; cursor: pointer;
      background: #8B3A1E; color: #FFFBF7; font: inherit; font-size: 13.5px;
    }
    #send:disabled { opacity: .45; cursor: default; }

    #settings { display: none; flex: 1; overflow-y: auto; padding: 14px; font-size: 13px; line-height: 1.7; }
    #settings.show { display: block; }
    #settings h3 { font-size: 13px; margin: 10px 0 4px; }
    #settings input[type=password], #settings input[type=text], #settings select {
      width: 100%; border: 1.8px solid #8B3A1E; border-radius: 10px; padding: 6px 9px;
      font: inherit; font-size: 13px; color: #5A2412; background: #fff; outline: none;
    }
    #settings .row { display: flex; gap: 6px; margin-top: 6px; }
    #settings button {
      border: 1.8px solid #8B3A1E; background: #fff; color: #8B3A1E; border-radius: 10px;
      padding: 5px 12px; font: inherit; font-size: 12.5px; cursor: pointer;
    }
    #settings button.main { background: #8B3A1E; color: #FFFBF7; }
    #settings .note { font-size: 11.5px; color: #9E5A40; margin-top: 4px; }
    #settings .ok { color: #3c7a3c; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="dot"></div>
      <div class="t">红蛋</div>
      <button id="gear" title="设置">⚙</button>
      <button id="x" title="关掉">×</button>
    </header>

    <div id="log"></div>

    <div id="settings">
      <h3>用哪家</h3>
      <select id="preset"></select>
      <h3>接口格式</h3>
      <select id="format">
        <option value="openai">OpenAI 兼容（大多数第三方都是这个）</option>
        <option value="anthropic">Claude 官方格式</option>
      </select>
      <h3>地址</h3>
      <input id="url" type="text" placeholder="https://…" autocomplete="off" spellcheck="false">
      <h3>模型</h3>
      <div class="row" style="margin-top:0">
        <select id="modelSel" style="flex:1;min-width:0"><option value="">（先存 key，再点读取）</option></select>
        <button id="loadModels" style="white-space:nowrap">读取模型</button>
      </div>
      <div id="modelState" class="note"></div>
      <input id="modelName" type="text" placeholder="读不到的话手填，比如 deepseek-chat" autocomplete="off" spellcheck="false" style="margin-top:6px">
      <div class="row"><button class="main" id="saveCfg">保存这几项</button></div>
      <div id="cfgState" class="note"></div>

      <h3>API key</h3>
      <div id="keyState" class="note"></div>
      <input id="key" type="password" placeholder="把那家平台给的 key 贴在这里" autocomplete="off" spellcheck="false">
      <div class="row">
        <button class="main" id="saveKey">保存</button>
        <button id="delKey">删掉 key</button>
      </div>
      <div class="note">key 加密存在这台 Mac 上，只发给上面填的那个地址。换了平台记得换成那家的 key。</div>

      <h3>记忆库令牌</h3>
      <div id="memState" class="note"></div>
      <input id="memToken" type="password" placeholder="把红蛋的记忆库令牌贴在这里" autocomplete="off" spellcheck="false">
      <input id="memUrl" type="text" placeholder="记忆库地址" autocomplete="off" spellcheck="false" style="margin-top:6px">
      <div class="row">
        <button class="main" id="saveMem">保存</button>
        <button id="testMem">试试连接</button>
        <button id="delMem">删掉令牌</button>
      </div>
      <div class="note">令牌也加密存在这台 Mac 上。红蛋只能写自己那一格（工作日记、给小克的留言），别的书架只能看。截图不会进记忆库。</div>

      <h3>聊天记录</h3>
      <div class="row"><button id="clear">清空</button></div>
      <div class="note">每次说话会带上最近二十几句，记录越长越费一点点钱。</div>

      <div class="row" style="margin-top:14px"><button class="main" id="back">回去聊天</button></div>
    </div>

    <form id="form">
      <textarea id="input" placeholder="跟红蛋说点什么" rows="1"></textarea>
      <button id="send" type="submit">说</button>
    </form>
  </div>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), send = $('send');

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    if (cls === 'sys') d.className = 'sys';
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  let st = await window.talk.state();
  function renderHistory() {
    log.textContent = '';
    if (!st.history.length) add('sys', st.hasKey ? '说点什么吧' : '先点右上角齿轮，把 API key 贴进去');
    for (const m of st.history) add(m.role === 'user' ? 'me' : 'egg', m.content);
  }
  renderHistory();

  // ---------- 设置 ----------
  const settings = $('settings');
  function showSettings(v) {
    settings.classList.toggle('show', v);
    log.style.display = v ? 'none' : '';
    $('form').style.display = v ? 'none' : '';
    if (v) {
      $('keyState').textContent = st.hasKey ? '已经存好了一个 key（看不到内容）' : '还没有 key';
      $('keyState').className = 'note' + (st.hasKey ? ' ok' : '');
      $('preset').innerHTML = '';
      for (const p of st.presets) {
        const o = document.createElement('option');
        o.value = p.id; o.textContent = p.name; o.selected = p.id === st.cfg.preset;
        $('preset').appendChild(o);
      }
      $('format').value = st.cfg.format;
      $('url').value = st.cfg.url;
      $('modelName').value = st.cfg.model;
      $('cfgState').textContent = '';
      showMem();
      fillModels([], '');
      if (st.hasKey && st.cfg.url) loadModels();
    } else input.focus();
  }

  // ---------- 记忆库令牌 ----------
  function showMem(msg, ok) {
    const m = st.mem || {};
    $('memUrl').value = m.url || '';
    $('memState').textContent = msg || (m.hasToken ? '已经存好了一个令牌（看不到内容）' : '还没有令牌，不填也能聊天，只是不写日记、不能给小克写信');
    $('memState').className = 'note' + ((msg ? ok : m.hasToken) ? ' ok' : '');
  }
  $('saveMem').onclick = async () => {
    const t = $('memToken').value.trim();
    if (/\s/.test(t)) { showMem('令牌里不应该有空格或换行，再复制一次试试'); return; }
    const r = await window.talk.setMem({ url: $('memUrl').value, ...(t ? { token: t } : {}) });
    $('memToken').value = '';
    st.mem = r.mem;
    if (!r.ok) { showMem(r.error); return; }
    showMem('存好了，正在试连接……', true);
    const t2 = await window.talk.testMem();
    showMem(t2.msg, t2.ok);
  };
  $('testMem').onclick = async () => { showMem('正在试……', true); const r = await window.talk.testMem(); showMem(r.msg, r.ok); };
  $('delMem').onclick = async () => { const r = await window.talk.setMem({ token: '' }); st.mem = r.mem; showMem(); };

  // ---------- 模型下拉框 ----------
  const sel = $('modelSel');
  function fillModels(models, msg, isErr) {
    sel.innerHTML = '';
    const cur = $('modelName').value.trim();
    const head = document.createElement('option');
    head.value = '';
    head.textContent = models.length ? '选一个模型' : (st.hasKey ? '（点右边读取）' : '（先存 key，再点读取）');
    sel.appendChild(head);
    for (const m of models) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.name && m.name !== m.id ? m.name + '（' + m.id + '）' : m.id;
      o.selected = m.id === cur;
      sel.appendChild(o);
    }
    $('modelState').textContent = msg || '';
    $('modelState').className = 'note' + (msg && !isErr ? ' ok' : '');
  }
  let loadSeq = 0;
  async function loadModels() {
    const seq = ++loadSeq;
    $('modelState').textContent = '正在读……'; $('modelState').className = 'note';
    const r = await window.talk.models({ format: $('format').value, url: $('url').value });
    if (seq !== loadSeq) return; // 读的时候又改了地址，旧结果不要了
    if (r.ok) fillModels(r.models, '读到 ' + r.models.length + ' 个，选了就会存好');
    else fillModels([], r.error, true);
  }
  $('loadModels').onclick = loadModels;
  sel.onchange = async () => {
    if (!sel.value) return;
    $('modelName').value = sel.value;
    await saveCfg();
  };
  $('gear').onclick = () => showSettings(!settings.classList.contains('show'));
  $('back').onclick = () => showSettings(false);
  $('x').onclick = () => window.talk.close();
  $('saveKey').onclick = async () => {
    const k = $('key').value.trim();
    if (!k) return;
    if (/\s/.test(k)) { $('keyState').textContent = 'key 里不应该有空格或换行，再复制一次试试'; return; }
    const r = await window.talk.setKey(k);
    $('key').value = '';
    st = await window.talk.state();
    if (r.ok) {
      // 留在设置里，顺手把模型列表读出来让她选
      $('keyState').textContent = '存好了'; $('keyState').className = 'note ok';
      renderHistory();
      if ($('url').value.trim()) loadModels();
    } else $('keyState').textContent = r.error;
  };
  $('delKey').onclick = async () => { await window.talk.setKey(''); st = await window.talk.state(); showSettings(true); };
  $('preset').onchange = (e) => {
    const p = st.presets.find((x) => x.id === e.target.value);
    if (!p || p.id === 'custom') return;
    $('format').value = p.format; $('url').value = p.url; $('modelName').value = p.model;
    $('cfgState').textContent = '';
    fillModels([], '');
    if (st.hasKey) loadModels();
  };
  $('format').onchange = () => fillModels([], '');
  $('url').onchange = () => fillModels([], '');
  $('saveCfg').onclick = () => saveCfg();
  async function saveCfg() {
    const r = await window.talk.setCfg({ preset: $('preset').value, format: $('format').value, url: $('url').value, model: $('modelName').value });
    if (r.ok) { st.cfg = r.cfg; $('preset').value = r.cfg.preset; const miss = !r.cfg.url ? '地址' : !r.cfg.model ? '模型名' : '';
      $('cfgState').textContent = miss ? '存了，不过' + miss + '还空着，不填没法说话' : '存好了';
      $('cfgState').className = miss ? 'note' : 'note ok'; }
    else { $('cfgState').textContent = r.error; $('cfgState').className = 'note'; }
  }
  $('clear').onclick = async () => { await window.talk.clear(); st = await window.talk.state(); showSettings(false); renderHistory(); };

  // ---------- 说话 ----------
  input.addEventListener('keydown', (e) => {
    // 回车发送；Shift+回车换行；中文输入法选字时的回车不算
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
  });
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    if (log.firstChild && log.firstChild.className === 'sys' && !st.history.length) log.textContent = '';
    add('me', text);
    input.value = '';
    send.disabled = true;
    const typing = document.createElement('div');
    typing.className = 'typing'; typing.textContent = '红蛋在想……';
    log.appendChild(typing); log.scrollTop = log.scrollHeight;
    const r = await window.talk.ask(text);
    typing.remove();
    if (r.ok) {
      add('egg', r.reply);
      for (const n of r.notes || []) add('sys', n);
      st.history.push({ role: 'user', content: text }, { role: 'assistant', content: r.reply });
    }
    else {
      add('sys', r.error || '没说出去');
      input.value = text; // 没发出去的话放回输入框
      if (r.needKey) showSettings(true);
    }
    send.disabled = false;
    input.focus();
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.talk.close(); });
  if (!st.hasKey) showSettings(true); else input.focus();
})();
</script>
</body>
</html>
